name: Publish on Version Change

on:
  push:
    branches:
      - v2

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1 # Setup bun
        with:
            bun-version: latest # You can also use a specific version

      - name: Detect version change
        id: versioncheck
        run: |
          CURRENT_VERSION=$(jq -r .version package.json)
          PREV_VERSION=$(git show HEAD~1:package.json | jq -r .version)

          echo "Current: $CURRENT_VERSION"
          echo "Previous: $PREV_VERSION"

          if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if version did not change
        if: steps.versioncheck.outputs.changed == 'false'
        run: echo "Version did not change. Skipping publish."

      - name: Install dependencies
        if: steps.versioncheck.outputs.changed == 'true'
        run: bun i --frozen-lockfile
      - name: Build source code
        if: steps.versioncheck.outputs.changed == 'true'
        run: bun run build
      - name: Create Tag
        if: steps.versioncheck.outputs.changed == 'true'
        run: |
          VERSION=$(jq -r .version package.json)
          git tag "v$VERSION"
          git push origin "v$VERSION"
