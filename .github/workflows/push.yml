name: Publish on Version Change

on:
  push:
    branches:
      - v2

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Detect version change
        id: versioncheck
        run: |
          CURRENT_VERSION=$(jq -r .version package.json)
          PREV_VERSION=$(git show HEAD~1:package.json | jq -r .version)

          echo "Current: $CURRENT_VERSION"
          echo "Previous: $PREV_VERSION"

          if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if version did not change
        if: steps.versioncheck.outputs.changed == 'false'
        run: echo "Version did not change. Skipping publish."

      - name: Install dependencies
        if: steps.versioncheck.outputs.changed == 'true'
        run: npm ci

      - name: Publish to npm
        if: steps.versioncheck.outputs.changed == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Tag
        if: steps.versioncheck.outputs.changed == 'true'
        run: |
          VERSION=$(jq -r .version package.json)
          git tag "v$VERSION"
          git push origin "v$VERSION"
